# README claim-evidence registry (backlog 0138)
# ---------------------------------------------------------------------------
# The README "What you get (feature breadth)" section makes status claims about
# what this project ships. Marketing-grade claims decay into fiction unless each
# one is pinned to something in the tree. This registry is that pin: every
# shipped (✅) or evolving (🚧) claim maps to at least one piece of evidence, and
# `tests/test_readme_verification.py` fails if a claim has no entry, an entry has
# no living claim, or any evidence pointer no longer resolves.
#
# Planned (🔭) claims are intentionally NOT listed here — they are roadmap, not
# shipped, so they carry no evidence obligation.
#
# ---------------------------------------------------------------------------
# HOW TO UPDATE THIS REGISTRY (read before editing the README status list)
# ---------------------------------------------------------------------------
# A capability moves 🔭 planned -> 🚧 evolving -> ✅ shipped. When you change a
# README status bullet, update this file in the same change:
#
#   * Promote 🔭 -> 🚧/✅: add a new [[claim]] whose `key` is the EXACT bold
#     title from the README bullet (the text between the ** **), set `status`,
#     and list evidence. A claim with no evidence is not "shipped".
#   * Reword a claim: change `key` here to match the new bold title verbatim
#     (the test matches on exact title text, so drift is caught, not guessed).
#   * Demote/remove a claim: delete its [[claim]] entry when the README bullet
#     goes away or reverts to 🔭 planned, otherwise the orphan check fails.
#
# Evidence pointers are "<kind>:<target>":
#   code:<path>       a source module that implements the claim
#   test:<path>       a test that exercises it
#   narrative:<path>  a docs/narratives/*.md walkthrough
#   doc:<path>        any other doc (docs/product, docs/decisions, ...)
#   decision:<path>   a docs/decisions/NNNN-*.md ADR
#   backlog:NNNN      a .miagent/backlog/NNNN-*.md item
# All file kinds resolve to a repo-relative path that must exist; `backlog`
# resolves to `.miagent/backlog/NNNN-*.md`. Prefer at least one `code:` (or
# `backlog:` for cross-repo work) so the claim is anchored to behavior, not prose.

